# 1D heat equation (dimensionless): alpha u_xx - u_t = 0 on x, t in [0, 1]
# u(x, 0) = sin(pi x), u(0, t) = u(1, t) = 0
# Exact solution: u(x, t) = sin(pi x) exp(-alpha pi^2 t)
name: heat
lr: 1.0e-3
problem:
  alpha: 0.05
  nx: 100                   # collocation grid (as in the monograph)
  nt: 250
  n_eval: 201               # evaluation grid n_eval x n_eval for the relative L2 error
